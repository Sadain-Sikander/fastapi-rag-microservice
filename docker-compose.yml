version: '3.8'

services:
  fastapi-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi-rag-microservice
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CHROMA_COLLECTION_NAME=pdf_docs
      - CHROMA_PERSIST_DIRECTORY=/app/chroma_data
      - PRIMARY_LLM_MODEL=gemini-2.0-flash
      - FALLBACK_LLM_MODEL=claude-3-5-sonnet-20241022
      - CHUNK_SIZE=500
      - TOP_K_RESULTS=3
    volumes:
      - ./chroma_data:/app/chroma_data
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

volumes:
  chroma_data:
    driver: local
